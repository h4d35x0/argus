; 13:37 — firmware for the LILYGO T-Watch Ultra
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = twatch_ultra
boards_dir = ./boards

[env:twatch_ultra]
framework = arduino
platform = espressif32@6.10.0
board = lilygo-t-watch-ultra
upload_speed = 921600
monitor_speed = 115200
board_build.filesystem = fatfs
extra_scripts = pre:scripts/patch_sensorlib.py

build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D ARDUINO_T_WATCH_S3_ULTRA
    ; lv_font_conv-generated fonts (src/font_argus_*.c) include "lvgl.h" directly
    ; under this flag instead of "lvgl/lvgl.h".
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -I variants/lilygo_twatch_ultra

    ; Trim unused RadioLib modules to reduce flash usage
    -D RADIOLIB_EXCLUDE_RF69
    -D RADIOLIB_EXCLUDE_SX1231
    -D RADIOLIB_EXCLUDE_RFM2X
    -D RADIOLIB_EXCLUDE_SX127X
    -D RADIOLIB_EXCLUDE_AFSK
    -D RADIOLIB_EXCLUDE_AX25
    -D RADIOLIB_EXCLUDE_HELLSCHREIBER
    -D RADIOLIB_EXCLUDE_MORSE
    -D RADIOLIB_EXCLUDE_RTTY
    -D RADIOLIB_EXCLUDE_SSTV
    -D RADIOLIB_EXCLUDE_DIRECT_RECEIVE
    -D RADIOLIB_EXCLUDE_APRS
    -D RADIOLIB_EXCLUDE_BELL

    ; Change to match your installed radio module:
    ;   ARDUINO_LILYGO_LORA_SX1262  (Sub-1G LoRa, default)
    ;   ARDUINO_LILYGO_LORA_SX1280  (2.4G LoRa)
    ;   ARDUINO_LILYGO_LORA_CC1101
    ;   ARDUINO_LILYGO_LORA_LR1121
    ;   ARDUINO_LILYGO_LORA_SI4432
    -D ARDUINO_LILYGO_LORA_SX1262

    -Wnarrowing

    ; Let deauth_attack.cpp's ieee80211_raw_frame_sanity_check override win over
    ; the (non-weak) net80211 definition, so raw deauth/disassoc injection is
    ; permitted. Link-time only: it only changes how a duplicate symbol resolves
    ; (the sole conflict is that intentional override), so it cannot affect runtime
    ; behavior. Deauth TX itself still needs on-hardware verification.
    -Wl,--allow-multiple-definition

monitor_filters =
    default
    esp32_exception_decoder

; LilyGoLib (#b3df890), ST25R3916-fork (#0c8e00f) and NFC-RFAL-fork (#7bde458)
; are VENDORED under lib/ instead of fetched as git deps. GitHub cannot
; shallow-fetch a bare commit SHA (`git fetch --depth=1 <sha>` fails once the
; commit is no longer a branch tip), and PlatformIO re-validates git deps by
; re-fetching on every build, so the upstream #sha form breaks fresh checkouts.
; Vendoring pins the exact source in-repo (reproducible, supply-chain-stable).
; The two LilyGoLib patches the old scripts/patch_lilygolib.py applied at build
; time (SEND_BUF_SIZE 16384->4096, LV_USE_SNAPSHOT 0->1) are now baked directly
; into lib/LilyGoLib/src, so the runtime patch hook is retired.
lib_deps =
    lvgl/lvgl @ 9.5.0
    jgromes/RadioLib @ 7.6.0
    lewisxhe/XPowersLib @ 0.3.3
    lewisxhe/SensorLib @ 0.3.4
    mikalhart/TinyGPSPlus @ 1.1.0

; Phase 0 ANCS bench spike. Inherits everything from twatch_ultra (build_flags,
; lib_deps, board, ...), defines ANCS_SPIKE (activates src/spike_ancs_main.cpp),
; and swaps out the real main.cpp so the spike provides setup()/loop(). Usage:
;   pio run -e ancs_spike -t upload && pio device monitor
[env:ancs_spike]
extends = env:twatch_ultra
build_flags =
    ${env:twatch_ultra.build_flags}
    -D ANCS_SPIKE
    -D ARGUS_NOTIFY_DEBUG
build_src_filter =
    +<*>
    -<main.cpp>

; Dev-only screenshot auto-capture. Full firmware + SCREENSHOT_AUTO, which makes
; main.cpp's loop() walk a curated set of screens and dump each to
; /Screenshots/<name>.bmp on the SD ~6s after boot (needs a microSD inserted).
; Flash it, let it run, then pull the BMPs (USB SD tool or the card), and reflash
; the normal twatch_ultra build. Usage:
;   pio run -e screenshots -t upload && pio device monitor
[env:screenshots]
extends = env:twatch_ultra
build_flags =
    ${env:twatch_ultra.build_flags}
    -D SCREENSHOT_AUTO
