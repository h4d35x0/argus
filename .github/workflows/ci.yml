# ARGUS continuous integration.
#
# TWO jobs on purpose. The host suite is fast and covers the security-critical
# pure logic, but it compiles only the modules listed in test/Makefile's MODULES
# - roughly two dozen files. Everything else in src/ (main.cpp, every *_screen.cpp,
# threat_radar.cpp, hexhound.cpp, the detectors' hardware halves) is NOT built by
# it. On 2026-09-04 two real defects sat in threat_radar.cpp and hexhound.cpp
# while the suite was fully green at 4966/0, because neither file is in MODULES.
# So `firmware` is not redundant with `host-tests`: it is the only thing that
# compiles the other ~90% of the tree.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Host suite (pure logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compiler version
        run: g++ --version

      # test/Makefile prepends MINGW_BIN, which does not exist on Linux and is
      # harmless there; CXX defaults to g++. No changes needed to run it here.
      - name: Build and run host suite
        run: make -C test test

  # sdcard/backgrounds/*.rgb565 are committed binaries derived from the images in
  # tools/wallpapers/. Nothing at build time regenerates them, so without this a
  # source image could be replaced and the raster the watch actually loads would
  # quietly stay the old one. --check re-derives and byte-compares; it writes
  # nothing.
  wallpapers:
    name: SD wallpapers match their sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: pip install pillow

      - name: Check committed rasters
        run: python tools/gen_wallpapers.py --check --stats

  # sim/ compiles the REAL screen sources (tools_screen.cpp, theme.cpp, the clock
  # screens) against LVGL's SDL backend. Nothing here ships to the watch, but it
  # is the only build that LINKS those files, so it catches what neither other
  # job can: on 2026-09-07 a new call to handshake_capture_channel() from
  # tools_screen.cpp left sim/ with an undefined reference while the host suite
  # and the firmware build both stayed green, because that symbol lives on the
  # device side and sim/ substitutes a stub. It would have shipped broken.
  #
  # LVGL is a PlatformIO dependency under .pio/libdeps, which is gitignored, so
  # it is cloned directly at the version platformio.ini pins rather than paying
  # for a whole PlatformIO install here. KEEP THIS PIN IN STEP with lib_deps.
  simulator:
    name: Simulator build (sim/)
    runs-on: ubuntu-latest
    env:
      LVGL_VERSION: '9.5.0'
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev

      - name: Check the LVGL pin still matches platformio.ini
        run: |
          pinned=$(grep -oE 'lvgl/lvgl *@ *[0-9]+\.[0-9]+\.[0-9]+' platformio.ini | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "platformio.ini pins LVGL $pinned; this job clones $LVGL_VERSION"
          test "$pinned" = "$LVGL_VERSION"

      - name: Fetch LVGL where sim/Makefile expects it
        run: |
          git clone --depth 1 --branch "v$LVGL_VERSION" https://github.com/lvgl/lvgl.git .pio/libdeps/twatch_ultra/lvgl

      - name: Build the simulator
        run: make -C sim

  firmware:
    name: Firmware build (twatch_ultra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The espressif32 toolchain is large; cache it or every run re-downloads
      # roughly a gigabyte.
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      # LilyGoLib, ST25R3916-fork and NFC-RFAL-fork are vendored under lib/ (see
      # platformio.ini) specifically so a fresh checkout builds without fetching
      # bare commit SHAs. CI is a fresh checkout every time, so this relies on it.
      - name: Build firmware
        run: pio run -e twatch_ultra

      - name: Report flash usage
        if: always()
        run: |
          echo "Flash budget is 3145728 bytes; the build has been running near 95%."
          pio run -e twatch_ultra --target size 2>/dev/null | tail -20 || true
